<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1.0, viewport-fit=cover"
    />
    <meta
      name="description"
      content="CountRoster — track anything from any device. A mobile-friendly client for your CountRoster server."
    />
    <meta name="color-scheme" content="light dark" />
    <meta name="theme-color" content="#1f2933" />
    <link rel="icon" href="/favicon.svg" type="image/svg+xml" />
    <link rel="apple-touch-icon" href="/icon.svg" />
    <!-- Make the iOS Safari "Add to Home Screen" install behave like an app. -->
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="CountRoster" />
    <title>CountRoster</title>
    <!--
      No install-personalization script here, deliberately. The *server*
      serves /trackers/:id/quick a shell already carrying that tracker's
      identity (no manifest link on iOS, a per-tracker manifest elsewhere) —
      see quickShell in server/cmd/countroster/main.go — and the service
      worker is configured to never answer those navigations with this
      generic shell (vite.config.ts navigateFallbackDenylist). An earlier
      inline script that rewrote the manifest link raced Safari's parse and
      lost; anything that matters for Add to Home Screen must be in the
      served markup.
    -->
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
