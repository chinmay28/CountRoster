<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1.0, viewport-fit=cover"
    />
    <meta
      name="description"
      content="CountRoster — track anything from any device. A mobile-friendly client for your CountRoster server."
    />
    <meta name="color-scheme" content="light dark" />
    <meta name="theme-color" content="#1f2933" />
    <link rel="icon" href="/favicon.svg" type="image/svg+xml" />
    <link rel="apple-touch-icon" href="/icon.svg" />
    <!-- Make the iOS Safari "Add to Home Screen" install behave like an app. -->
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="CountRoster" />
    <title>CountRoster</title>
    <!--
      A quick-log deep link installs as *that tracker's* app.

      Browsers install what the manifest declares, not the page you added:
      the app manifest says start_url "/", so an icon added from
      /trackers/:id/quick would open the home screen. Point the link at the
      tracker's own manifest (served by the Go server from its name and
      color) instead. This runs during head parsing rather than from React so
      the manifest is already right when Safari resolves it — long before the
      tracker data has loaded and the app could swap it.
    -->
    <script>
      (function () {
        var match = location.pathname.match(/^\/trackers\/([^/]+)\/quick\/?$/);
        if (!match) return;
        function pointAtTracker() {
          var link = document.querySelector('link[rel="manifest"]');
          if (!link) return false;
          // Remember the app's own manifest so the client can restore it when
          // navigating off the quick screen.
          if (!link.dataset.appManifest) {
            link.dataset.appManifest = link.getAttribute('href') || '';
          }
          link.setAttribute('href', '/trackers/' + match[1] + '/app.webmanifest');
          return true;
        }
        // The manifest link is injected by vite-plugin-pwa and may be parsed
        // after this script, so retry once the document is complete.
        if (!pointAtTracker()) {
          document.addEventListener('DOMContentLoaded', pointAtTracker);
        }
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
