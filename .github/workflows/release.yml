name: Release

# Publishes a GitHub release with the deployable binaries.
#
# Four ways in, all releasing the commit they run on:
#
#   * push to `main`                  — releases the version that commit
#                                       builds, but only when CHANGELOG.md has a
#                                       `## <that version>` section; any other
#                                       push to main is an ordinary commit and
#                                       is skipped (the same gate SandHarbor's
#                                       release uses)
#   * push a `v*` tag
#   * push a `release/v*` branch      — same thing where tag pushes aren't
#                                       allowed; the release creates the tag
#   * run it by hand (workflow_dispatch) naming the tag to create
#
# The changelog section is the gate: a tag, `release/v*` branch or dispatch
# whose version CHANGELOG.md doesn't name fails rather than publishing with
# made-up notes.
#
# The artifact is the deployable unit described in README.md: a single static
# Go binary (CGO_ENABLED=0) with the built PWA embedded, so a target host needs
# no Node, no Go, and no source tree. `scripts/quickstart.sh` consumes exactly
# these assets when run with COUNTROSTER_INSTALL=release — the asset names are
# the contract between the two.
#
# The release body is the matching section of CHANGELOG.md (see that file's
# header).
#
# A second job attaches the Android app, `countroster-android.apk` (+ .sha256),
# signed with the key in the COUNTROSTER_ANDROID_* secrets, or else the
# ANDROID_KEYSTORE_BASE64 / ANDROID_KEYSTORE_PASSWORD pair every Harbor app's
# release reads (one key, alias `harbor`; see apps/android/README.md). Without those secrets it skips with a warning:
# an unsigned APK can't be installed, and a throwaway key would make every
# release un-upgradable from the last.
#
# NOTE the version is `vYEAR.MONTH.<commit count>`, all taken from the commit
# (YEAR.MONTH = its committer date in UTC; scripts/version.mjs), so
# this workflow needs `fetch-depth: 0` — a shallow checkout reports patch 0 —
# and it refuses to publish if the tag doesn't equal the version the build
# stamps into the binary.

on:
  push:
    tags:
      - 'v*'
    branches:
      - main
      - 'release/v*'
  workflow_dispatch:
    inputs:
      tag:
        description: 'Tag to release this ref as (e.g. v2026.10.512); created if absent'
        required: true

permissions:
  contents: write

jobs:
  # Decides whether this run releases anything, and as which tag, before any
  # build starts — so an ordinary push to main costs one checkout.
  gate:
    name: Is this a release?
    runs-on: ubuntu-latest
    outputs:
      release: ${{ steps.gate.outputs.release }}
      tag: ${{ steps.gate.outputs.tag }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0 # the version's patch number is the commit count

      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Resolve the tag and check CHANGELOG.md names it
        id: gate
        run: |
          set -euo pipefail
          version="$(node scripts/version.mjs)"
          case "$GITHUB_REF" in
            refs/tags/*)          tag="${GITHUB_REF#refs/tags/}" ;;
            refs/heads/release/*) tag="${GITHUB_REF#refs/heads/release/}" ;;
            refs/heads/main)      tag="$version" ;;
            *)                    tag="${{ inputs.tag }}" ;;
          esac
          [ -n "$tag" ] || { echo "::error::no tag to release ($GITHUB_REF)"; exit 1; }
          echo "tag=$tag" >> "$GITHUB_OUTPUT"
          if grep -qE "^## $tag([^0-9.]|\$)" CHANGELOG.md; then
            echo "release=true" >> "$GITHUB_OUTPUT"
            echo "releasing $GITHUB_SHA as $tag"
          elif [ "$GITHUB_REF" = "refs/heads/main" ]; then
            echo "no '## $tag' section in CHANGELOG.md — not a release commit, skipping"
            echo "release=false" >> "$GITHUB_OUTPUT"
          else
            echo "::error::CHANGELOG.md has no '## $tag' section — a tag the changelog does not name must not be published."
            exit 1
          fi

  release:
    name: Build and publish
    needs: gate
    if: needs.gate.outputs.release == 'true'
    runs-on: ubuntu-latest
    env:
      # Space-separated GOARCH list. Cross-compiling is free here because the
      # SQLite driver is pure Go — add `amd64` to publish that too.
      GOARCHES: arm64

    steps:
      - name: Check out ${{ github.ref_name }}
        uses: actions/checkout@v4
        with:
          fetch-depth: 0 # the version's patch number is the commit count

      - name: Take the release tag from the gate
        run: echo "TAG=${{ needs.gate.outputs.tag }}" >> "$GITHUB_ENV"

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm

      - uses: actions/setup-go@v5
        with:
          go-version-file: server/go.mod
          cache-dependency-path: server/go.sum

      - name: Verify the tag matches the built version
        run: |
          set -euo pipefail
          version="$(node scripts/version.mjs)"
          echo "tag=$TAG version=$version"
          if [ "$version" != "$TAG" ]; then
            echo "::error::tag $TAG does not match the version this commit builds ($version)."
            echo "The patch number is the commit count — tag the commit whose count matches."
            exit 1
          fi

      - name: Install dependencies
        run: npm ci

      - name: Build the web client
        run: |
          set -euo pipefail
          npm run build --workspace @countroster/core   # the web client imports its types
          npm run build --workspace @countroster/web

      - name: Embed the PWA into the server
        run: |
          set -euo pipefail
          find server/cmd/countroster/webdist -mindepth 1 ! -name README.txt -delete
          cp -r apps/web/dist/. server/cmd/countroster/webdist/

      - name: Build static binaries
        run: |
          set -euo pipefail
          vflags="$(node scripts/version.mjs --ldflags)"
          mkdir -p dist
          for arch in $GOARCHES; do
            out="dist/countroster-linux-$arch"
            echo "==> building $out ($TAG)"
            # CGO_ENABLED=0 → a fully static binary; keep it that way.
            (cd server && CGO_ENABLED=0 GOOS=linux GOARCH="$arch" go build \
              -trimpath \
              -ldflags "-s -w $vflags" \
              -o "../$out" ./cmd/countroster)
            file "$out"
          done
          (cd dist && for f in countroster-linux-*; do sha256sum "$f" > "$f.sha256"; done)
          ls -lh dist

      - name: Assemble the release notes from CHANGELOG.md
        id: notes
        run: |
          set -euo pipefail
          # The section for this tag, from its `## <tag>` heading to the next one.
          awk -v tag="$TAG" '
            $0 ~ "^## " tag "([^0-9.]|$)" { found = 1; next }
            found && /^## / { exit }
            found { print }
          ' CHANGELOG.md > release-notes.md

          heading="$(grep -m1 -E "^## $TAG([^0-9.]|\$)" CHANGELOG.md || true)"
          # Strip "## <tag>" and the dash that separates it from the title. Done
          # with parameter expansion, not a bracket expression, so the em dash
          # matches byte-wise regardless of the runner's locale.
          title="${heading#\#\# }"; title="${title#"$TAG"}"
          title="${title# }"; title="${title#—}"; title="${title#-}"; title="${title# }"

          if [ -s release-notes.md ]; then
            echo "title=$TAG — ${title:-$TAG}" >> "$GITHUB_OUTPUT"
            # GitHub only auto-links a full changelog when it generates the
            # notes itself, so add the compare link to the curated body.
            prev="$(git tag --list 'v*' --sort=-version:refname | grep -vFx "$TAG" | head -n 1 || true)"
            if [ -n "$prev" ]; then
              printf '\n**Full Changelog**: %s/compare/%s...%s\n' \
                "$GITHUB_SERVER_URL/$GITHUB_REPOSITORY" "$prev" "$TAG" >> release-notes.md
            fi
          else
            # The gate already checked the heading exists; an empty section is
            # still a release without notes, which is not one to publish.
            echo "::error::the '## $TAG' section in CHANGELOG.md is empty."
            exit 1
          fi

      - name: Publish the release
        env:
          GH_TOKEN: ${{ github.token }}
          TITLE: ${{ steps.notes.outputs.title }}
        run: |
          set -euo pipefail
          if [ -s release-notes.md ]; then
            notes_args=(--notes-file release-notes.md)
          else
            notes_args=(--generate-notes)
          fi
          # --target creates the tag at this commit when it doesn't exist yet,
          # which is what a `release/v*` branch push relies on. It is ignored
          # when the tag is already there.
          if gh release view "$TAG" >/dev/null 2>&1; then
            echo "==> release $TAG already exists; updating notes and assets"
            # `gh release edit` has no --generate-notes, so only rewrite the
            # body when there is a curated one to write.
            if [ -s release-notes.md ]; then
              gh release edit "$TAG" --title "$TITLE" --notes-file release-notes.md
            fi
            gh release upload "$TAG" dist/countroster-linux-* --clobber
          else
            gh release create "$TAG" --target "$GITHUB_SHA" \
              --title "$TITLE" "${notes_args[@]}" dist/countroster-linux-*
          fi
          gh release view "$TAG" --json tagName,assets --jq '{tag: .tagName, assets: [.assets[].name]}'

  android:
    name: Android app
    needs: [gate, release]
    runs-on: ubuntu-latest
    env:
      KEYSTORE_B64: ${{ secrets.COUNTROSTER_ANDROID_KEYSTORE_BASE64 || secrets.ANDROID_KEYSTORE_BASE64 }}
    steps:
      - name: Check for a signing key
        id: key
        run: |
          if [ -z "$KEYSTORE_B64" ]; then
            echo "::warning::no COUNTROSTER_ANDROID_KEYSTORE_BASE64 (or shared ANDROID_KEYSTORE_BASE64) secret — the release ships without the Android app. See apps/android/README.md."
            echo "present=false" >> "$GITHUB_OUTPUT"
          else
            echo "present=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Check out ${{ github.ref_name }}
        if: steps.key.outputs.present == 'true'
        uses: actions/checkout@v4
        with:
          fetch-depth: 0 # versionCode is the commit count

      - name: Take the release tag from the gate
        if: steps.key.outputs.present == 'true'
        run: echo "TAG=${{ needs.gate.outputs.tag }}" >> "$GITHUB_ENV"

      - uses: actions/setup-node@v4
        if: steps.key.outputs.present == 'true'
        with:
          node-version: '22'
          cache: npm

      - uses: actions/setup-go@v5
        if: steps.key.outputs.present == 'true'
        with:
          go-version-file: server/go.mod
          cache-dependency-path: server/go.sum

      - uses: actions/setup-java@v4
        if: steps.key.outputs.present == 'true'
        with:
          distribution: temurin
          java-version: '17'

      - uses: gradle/actions/setup-gradle@v4
        if: steps.key.outputs.present == 'true'

      - name: Build the signed APK
        if: steps.key.outputs.present == 'true'
        env:
          COUNTROSTER_KEYSTORE_PASSWORD: ${{ secrets.COUNTROSTER_ANDROID_KEYSTORE_PASSWORD || secrets.ANDROID_KEYSTORE_PASSWORD }}
          COUNTROSTER_KEY_ALIAS: ${{ secrets.COUNTROSTER_ANDROID_KEY_ALIAS || secrets.ANDROID_KEY_ALIAS || 'harbor' }}
          COUNTROSTER_KEY_PASSWORD: ${{ secrets.COUNTROSTER_ANDROID_KEY_PASSWORD || secrets.ANDROID_KEY_PASSWORD || secrets.ANDROID_KEYSTORE_PASSWORD }}
        run: |
          set -euo pipefail
          export COUNTROSTER_KEYSTORE="$RUNNER_TEMP/release.keystore"
          printf '%s' "$KEYSTORE_B64" | base64 -d > "$COUNTROSTER_KEYSTORE"
          npm ci
          scripts/build-android.sh assembleRelease
          rm -f "$COUNTROSTER_KEYSTORE"
          apksigner="$(ls -d "$ANDROID_HOME"/build-tools/*/ | sort -V | tail -n 1)apksigner"
          "$apksigner" verify apps/android/app/build/outputs/apk/release/app-release.apk
          mkdir -p dist
          cp apps/android/app/build/outputs/apk/release/app-release.apk dist/countroster-android.apk
          (cd dist && sha256sum countroster-android.apk > countroster-android.apk.sha256)

      - name: Attach it to the release
        if: steps.key.outputs.present == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release upload "$TAG" dist/countroster-android.apk dist/countroster-android.apk.sha256 --clobber
