name: Android

# Builds the Android app (apps/android) and tests it at three levels:
#
#   * JVM unit tests — the launcher, bridge and shortcut logic, plus the
#     Kotlin launcher driving the real Go engine (a host-native build of it);
#   * the Go engine suites, including the engine under Android's exact app
#     seccomp allowlist — x86_64 here, and the shipping arm64 binary on an
#     arm64 runner;
#   * instrumented tests on an emulator — the x86_64 engine exec'd from the
#     native library directory under Android's real seccomp filter, its
#     timezone and DNS, and the WebView rendering the app.
#
# The debug APK is uploaded as an artifact. See MOBILE.md.

on:
  push:
    paths:
      - 'apps/android/**'
      - 'apps/web/**'
      - 'packages/core/**'
      - 'server/**'
      - 'scripts/build-android.sh'
      - 'scripts/version.mjs'
      - '.github/workflows/android.yml'
  pull_request:
    paths:
      - 'apps/android/**'
      - 'apps/web/**'
      - 'packages/core/**'
      - 'server/**'
      - 'scripts/build-android.sh'
      - 'scripts/version.mjs'
      - '.github/workflows/android.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: android-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build and unit test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0 # the version's patch number is the commit count

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm

      - uses: actions/setup-go@v5
        with:
          go-version-file: server/go.mod
          cache-dependency-path: server/go.sum

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: gradle/actions/setup-gradle@v4

      - name: Install dependencies
        run: npm ci

      # Includes the Android seccomp stand-in: the stock x86_64 engine must die
      # under it and the patched one must work (cmd/engine/androidlibc).
      - name: Go engine tests
        env:
          COUNTROSTER_SECCOMP_TEST: '1'
        run: cd server && go test ./internal/engine/... ./internal/stack/... ./cmd/engine/...

      # A throwaway keystore proves the release signing path (the real key
      # lives in the release workflow's secrets).
      - name: Make a throwaway signing key
        run: |
          set -euo pipefail
          keytool -genkeypair -noprompt -keystore "$RUNNER_TEMP/ci.keystore" \
            -alias ci -keyalg RSA -keysize 2048 -validity 1 \
            -storepass ci-pass -keypass ci-pass -dname "CN=CountRoster CI"
          {
            echo "COUNTROSTER_KEYSTORE=$RUNNER_TEMP/ci.keystore"
            echo "COUNTROSTER_KEYSTORE_PASSWORD=ci-pass"
            echo "COUNTROSTER_KEY_ALIAS=ci"
            echo "COUNTROSTER_KEY_PASSWORD=ci-pass"
          } >> "$GITHUB_ENV"

      - name: Build the app and run its unit tests
        run: scripts/build-android.sh assembleDebug assembleRelease testDebugUnitTest

      - name: Verify the release APK is signed
        run: |
          set -euo pipefail
          apksigner="$(ls -d "$ANDROID_HOME"/build-tools/*/ | sort -V | tail -n 1)apksigner"
          "$apksigner" verify --print-certs apps/android/app/build/outputs/apk/release/app-release.apk

      - name: Upload the debug APK
        uses: actions/upload-artifact@v4
        with:
          name: countroster-debug-apk
          path: apps/android/app/build/outputs/apk/debug/*.apk
          if-no-files-found: error

      - name: Upload unit test reports
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: unit-test-reports
          path: apps/android/app/build/reports/tests/

  # The phone binary itself — built exactly as the app packages it — on an
  # arm64 runner, under Android's arm64 app seccomp allowlist
  # (cmd/engine/android_policy_test.go). It's a static binary, so it runs
  # directly, as it does on a phone.
  engine-arm64:
    name: arm64 engine under Android's seccomp policy
    runs-on: ubuntu-24.04-arm
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version-file: server/go.mod
          cache-dependency-path: server/go.sum

      - name: Build the engines as the app ships them
        run: |
          set -euo pipefail
          server/cmd/engine/build-android-engines.sh "$RUNNER_TEMP/jniLibs"
          file "$RUNNER_TEMP/jniLibs/arm64-v8a/libcountroster_engine.so"

      - name: Run the arm64 engine under Android's arm64 app policy
        env:
          COUNTROSTER_SECCOMP_TEST: '1'
          COUNTROSTER_SECCOMP_ENGINE: ${{ runner.temp }}/jniLibs/arm64-v8a/libcountroster_engine.so
        run: cd server && go test -count=1 -v -run 'AndroidsFilter' ./cmd/engine

  emulator:
    name: Instrumented tests (emulator)
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm

      - uses: actions/setup-go@v5
        with:
          go-version-file: server/go.mod
          cache-dependency-path: server/go.sum

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: gradle/actions/setup-gradle@v4

      - name: Install dependencies
        run: npm ci

      - name: Build the app and its test APK
        run: scripts/build-android.sh assembleDebug assembleDebugAndroidTest

      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      - name: Run instrumented tests
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 34
          target: google_apis
          arch: x86_64
          disable-animations: true
          # A non-UTC zone, so the test can tell the device's zone from Go's
          # UTC default. `adb root` works on google_apis images. On failure:
          # the crash buffer and the lines that say who died and why (an
          # unfiltered '*:E' tail is all Play services noise), plus the whole
          # logcat in the uploaded report.
          script: |
            adb root || true
            adb wait-for-device
            adb shell setprop persist.sys.timezone America/Los_Angeles || true
            cd apps/android && ./gradlew --no-daemon connectedDebugAndroidTest || { mkdir -p app/build/reports/androidTests; adb logcat -d -v threadtime > app/build/reports/androidTests/logcat.txt; adb logcat -d -b crash; grep -E 'CountRoster|TestRunner|AndroidRuntime|DEBUG|libc|chromium|cr_|ActivityManager.*(countroster|Kill|died|ANR)|lowmemorykiller|lmkd' app/build/reports/androidTests/logcat.txt | tail -n 400; exit 1; }

      - name: Upload instrumented test reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: instrumented-test-reports
          path: apps/android/app/build/reports/androidTests/
