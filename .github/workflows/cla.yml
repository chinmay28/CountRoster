name: CLA

# Records each contributor's explicit agreement to CLA.md, which is what lets
# the maintainer offer CountRoster under terms other than the AGPL (an App
# Store build, a commercial licence) — see LICENSING.md. The DCO check
# (dco.yml) still runs on every commit; this is the one-time signature.
#
# A contributor signs by commenting, on their pull request:
#
#   I have read the CLA Document and I hereby sign the CLA
#
# Signatures are stored in signatures/cla.json on the `cla-signatures` branch
# (keep that branch unprotected so the action can commit to it). The
# maintainer's own pull requests are skipped: they hold the copyright, and
# commits Claude authors in the maintainer's sessions are made on their behalf.
#
# pull_request_target is deliberate and safe here: the action never checks
# out or runs the pull request's code; it only reads commit authors.

on:
  issue_comment:
    types: [created]
  pull_request_target:
    types: [opened, closed, synchronize]

permissions:
  actions: write
  contents: write # commits signatures to the cla-signatures branch
  pull-requests: write
  statuses: write

jobs:
  cla:
    name: Contributor License Agreement
    runs-on: ubuntu-latest
    if: >-
      (github.event_name == 'pull_request_target' &&
        github.event.pull_request.user.login != 'chinmay28') ||
      (github.event_name == 'issue_comment' && github.event.issue.pull_request &&
        github.event.issue.user.login != 'chinmay28' &&
        (github.event.comment.body == 'recheck' ||
          github.event.comment.body == 'I have read the CLA Document and I hereby sign the CLA'))
    steps:
      - name: Check signatures
        uses: contributor-assistant/github-action@v2.6.1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          path-to-signatures: signatures/cla.json
          path-to-document: https://github.com/chinmay28/CountRoster/blob/main/CLA.md
          branch: cla-signatures
          allowlist: dependabot[bot],github-actions[bot]
          custom-notsigned-prcomment: >-
            Thanks for contributing to CountRoster! Before this can merge, each
            author needs to accept the [Contributor License Agreement](https://github.com/chinmay28/CountRoster/blob/main/CLA.md)
            once — it lets the maintainer offer the project under other terms
            too (an App Store build, for example) while it stays AGPL. To sign,
            comment on this pull request with the sentence below.
          custom-allsigned-prcomment: All authors have signed the CLA. Thank you!
